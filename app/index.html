<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记账本</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">💰</span>
        <span class="brand-text">记账本</span>
      </div>
      <nav class="nav" id="nav">
        <a class="nav-item" href="#/home" data-route="home"><span class="nav-ico">🏠</span>首页</a>
        <a class="nav-item" href="#/bills" data-route="bills"><span class="nav-ico">📋</span>账单</a>
        <a class="nav-item" href="#/stats" data-route="stats"><span class="nav-ico">📊</span>统计</a>
        <a class="nav-item" href="#/budget" data-route="budget"><span class="nav-ico">🎯</span>预算<span class="nav-badge" id="budgetBadge" hidden></span></a>
        <a class="nav-item" href="#/categories" data-route="categories"><span class="nav-ico">🏷️</span>分类</a>
        <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-ico">⚙️</span>设置</a>
      </nav>
      <div class="sidebar-foot">
        <span class="muted">今日</span>
        <strong id="todayBrief">¥0.00</strong>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="pageTitle">首页</h1>
        <div class="topbar-right">
          <div class="month-switch" id="monthSwitch" hidden>
            <button class="icon-btn" id="monthPrev" title="上个月" aria-label="上个月">‹</button>
            <button class="month-label" id="monthLabel" title="回到本月"></button>
            <button class="icon-btn" id="monthNext" title="下个月" aria-label="下个月">›</button>
          </div>
          <button class="btn btn-primary" id="quickAdd">＋ 记一笔</button>
        </div>
      </header>
      <section class="content" id="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <div id="offline" class="offline" hidden>
    <div class="offline-card">
      <h2>本地服务未连接</h2>
      <p>请双击项目文件夹里的 <code>启动记账.bat</code>，再点下面的重试。</p>
      <button class="btn btn-primary" id="retryBtn">重试</button>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
